{{define "title"}}Properties — Inventorio{{end}}

{{define "nav-properties"}}active{{end}}

{{define "content"}}
<div id="properties-content">
  <header class="page-header">
    <h1>Properties Needs Definition</h1>
  </header>

  <table class="needs-table">
    <thead>
      {{template "property-header-row" .Header}}
    </thead>
    <tbody id="properties-list">
      {{range .Rows}}
      {{template "property-row" .}}
      {{end}}
    </tbody>
  </table>

  <div style="margin-top: 1rem;">
    <button class="btn btn--primary" type="button" hx-post="/properties" hx-target="#properties-list"
      hx-swap="beforeend">Add Property</button>
  </div>
</div>
{{end}}
