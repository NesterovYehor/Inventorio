{{define "title"}}{{.T "title_properties"}}{{end}}

{{define "nav-properties"}}active{{end}}

{{define "content"}}
<div id="properties-content">
  <header class="page-header">
    <h1>{{.T "page_properties"}}</h1>
  </header>

  <table class="needs-table">
    <thead>
      {{template "property-header-row" .}}
    </thead>
    <tbody id="properties-list">
      {{range .Data.Rows}}
      {{template "property-row" ($.Wrap .)}}
      {{end}}
    </tbody>
  </table>

  <div style="margin-top: 1rem;">
    <button class="btn btn--primary" type="button" hx-post="/properties" hx-target="#properties-list"
      hx-swap="beforeend">{{.T "add_property"}}</button>
  </div>
</div>
{{end}}
