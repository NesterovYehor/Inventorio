{{define "title"}}Storage — Inventorio{{end}}

{{define "nav-storage"}}active{{end}}

{{define "content"}}
<div id="storage-content">
  <header class="page-header">
    <h1>Storage</h1>
  </header>

  <table class="needs-table">
    <thead>
      <tr>
        <th scope="col">Name <span class="sort">&uarr;</span></th>
        <th scope="col">Quantity <span class="sort">&#8693;</span></th>
        <th scope="col" class="row-actions">Delete</th>
      </tr>
    </thead>
    <tbody id="storage-rows">
      {{range .}}
      {{template "item-row" .}}
      {{end}}
    </tbody>
  </table>

  <button class="btn btn--primary" type="button" hx-post="/items" hx-target="#storage-rows" hx-swap="beforeend">Add
    Item</button>
</div>
{{end}}
