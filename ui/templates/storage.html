{{define "title"}}{{.T "title_storage"}}{{end}}

{{define "nav-storage"}}active{{end}}

{{define "content"}}
<div id="storage-content">
  <header class="page-header">
    <h1>{{.T "page_storage"}}</h1>
  </header>

  <table class="needs-table">
    <thead>
      <tr>
        <th scope="col">{{.T "name"}} <span class="sort">&uarr;</span></th>
        <th scope="col">{{.T "quantity"}} <span class="sort">&#8693;</span></th>
        <th scope="col" class="row-actions"></th>
      </tr>
    </thead>
    <tbody id="storage-rows">
      {{range .Data}}
      {{template "item-row" ($.Wrap .)}}
      {{end}}
    </tbody>
  </table>

  <button class="btn btn--primary" type="button" hx-post="/items" hx-target="#storage-rows" hx-swap="beforeend">{{.T "add_item"}}</button>
</div>
{{end}}
