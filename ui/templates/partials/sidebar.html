{{define "sidebar"}}
<aside class="sidebar">
  <h2 class="sidebar__logo">Inventorio</h2>
  <nav class="sidebar__nav">
    <ul>
      <li>
        <a href="/properties" class="{{block " nav-properties" .}}{{end}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.8V21h14V9.8" />
          </svg>
          {{.T "nav_properties"}}
        </a>
      </li>
      <li>
        <a href="/items" class="{{block " nav-storage" .}}{{end}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 8 12 3 3 8v8l9 5 9-5V8Z" />
            <path d="M3 8l9 5 9-5" />
            <path d="M12 13v8" />
          </svg>
          {{.T "nav_storage"}}
        </a>
      </li>
      <li>
        <a href="/orders" class="{{block " nav-orders" .}}{{end}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="20" r="1.6" />
            <circle cx="18" cy="20" r="1.6" />
            <path d="M2 3h3l2.6 12.5h11.4L22 7H6" />
          </svg>
          {{.T "nav_orders"}}
        </a>
      </li>
      <li>
        <a href="/arrivals" class="{{block " nav-arrivals" .}}{{end}}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18" />
            <path d="M5 21V7l8-4 8 4v14" />
            <path d="M10 21v-9h4v9" />
          </svg>
          {{.T "nav_arrivals"}}
        </a>
      </li>
    </ul>
  </nav>

  <form class="sidebar__lang" method="get" action="">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M2 12h20" />
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
    </svg>
    <select name="lang" id="lang-select" aria-label="{{.T "language"}}" onchange="this.form.submit()">
      <option value="en" {{if eq .Lang "en"}}selected{{end}}>{{.T "lang_en"}}</option>
      <option value="ru" {{if eq .Lang "ru"}}selected{{end}}>{{.T "lang_ru"}}</option>
      <option value="es" {{if eq .Lang "es"}}selected{{end}}>{{.T "lang_es"}}</option>
    </select>
  </form>
</aside>
{{end}}
